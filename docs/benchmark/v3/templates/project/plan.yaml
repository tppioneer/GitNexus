version: 1
name: REPLACE_PROJECT_SLUG-agent-benchmark

target_project:
  name: REPLACE_PROJECT_NAME
  path: REPLACE_WITH_ABSOLUTE_REPOSITORY_PATH
  language: REPLACE_LANGUAGE
  build_tool: REPLACE_BUILD_TOOL
  validation_commands:
    - REPLACE_VALIDATION_COMMAND

project_overview:
  name: REPLACE_PROJECT_NAME
  language: REPLACE_LANGUAGE
  framework: REPLACE_FRAMEWORK
  lines_of_code: 0
  modules: 0
  description: REPLACE_PROJECT_DESCRIPTION

case_source:
  directory: docs/benchmark/REPLACE_VERSION/REPLACE_PROJECT_SLUG/cases
  golden_directory: docs/benchmark/REPLACE_VERSION/REPLACE_PROJECT_SLUG/ground-truth
  hide_expected_fields_from_agent: true
  cases:
    - id: REPLACE_PROJECT_SLUG-case-a-REPLACE_CASE_SLUG
      file: cases/REPLACE_PROJECT_SLUG-case-a-REPLACE_CASE_SLUG.yaml
      golden: ground-truth/REPLACE_PROJECT_SLUG-case-a-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false

run_matrix:
  agents: [claude-code]
  tool_policies: [grep, graph]
  repeats_per_cell: 3
  total_required_runs: 6

isolation:
  analysis_cases:
    fresh_agent_context: true
    clean_worktree_required: false
    allow_no_edit: true
  modification_cases:
    fresh_agent_context: true
    clean_worktree_required: true
    isolated_worktree_per_run: true
    reset_or_discard_after_run: true
  forbidden_context:
    - golden answers
    - previous run outputs
    - scoring notes
    - benchmark design discussion documents

success_criteria:
  - Every required cell produces a valid result or an explicit invalid record.
  - Graph/Grep conclusions use matched case, agent, model, and repeat pairs.
