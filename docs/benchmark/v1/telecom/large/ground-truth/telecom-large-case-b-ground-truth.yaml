risk_justification: >
  HIGH risk — 5 个目标实现 + 2 个核心调用方 + 5 个测试类受直接影响。
  全项目共有 33+ 个 evaluate 方法，grep-only 策略在 50K 规模下
  误报率极高。必须通过接口类型识别（RuleEvaluator vs 其他接口或无接口）
  来精确区分目标。

verification:
  - mvn -pl alarm-engine-service test
  - mvn test
