  - file: ops-gateway-service/.../service/DashboardAggregationService.java
  - file: ops-gateway-service/.../mapper/DashboardResponseMapper.java
  - file: src/test/resources/fixtures/device-info/base-station-huawei.json
  - file: src/test/resources/fixtures/device-metric/cpu-critical.json
  - file: src/test/resources/fixtures/alarm/alarm-critical-region-east.json
