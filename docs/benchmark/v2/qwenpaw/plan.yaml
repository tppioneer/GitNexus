version: 1
name: qwenpaw-multilanguage-agent-benchmark

target_project:
  name: QwenPaw
  gitnexus_repo: QwenPaw
  path: F:/develop/codes/QwenPaw/QwenPaw
  language: python+typescript
  build_tool: pyproject+pnpm
  project_layout:
    backend:
      language: python
      path: src/qwenpaw
    frontend:
      language: typescript
      path: website
  validation_commands:
    - python -m pytest
    - cd website && pnpm exec tsc -b --noEmit

project_overview:
  name: QwenPaw
  language: Python + TypeScript
  framework: Click CLI, FastAPI, Pydantic, Vue 3
  lines_of_code: 88102
  modules: 2
  description: AI 编码助手后端服务，Python Click CLI 插件体系 + TypeScript 前端下载页面

case_source:
  directory: docs/benchmark/v2/qwenpaw/cases
  golden_directory: docs/benchmark/v2/qwenpaw/ground-truth
  hide_expected_fields_from_agent: true
  cases:
    - id: qwenpaw-case-d-agent-reload-blast-radius
      file: cases/qwenpaw-case-d-agent-reload-blast-radius.yaml
      golden: ground-truth/qwenpaw-case-d-agent-reload-blast-radius-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: qwenpaw-case-e-provider-model-factory-impact
      file: cases/qwenpaw-case-e-provider-model-factory-impact.yaml
      golden: ground-truth/qwenpaw-case-e-provider-model-factory-impact-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: qwenpaw-case-f-control-command-handler-impact
      file: cases/qwenpaw-case-f-control-command-handler-impact.yaml
      golden: ground-truth/qwenpaw-case-f-control-command-handler-impact-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: qwenpaw-case-u-console-chat-stream-flow
      file: cases/qwenpaw-case-u-console-chat-stream-flow.yaml
      golden: ground-truth/qwenpaw-case-u-console-chat-stream-flow-ground-truth.yaml
      task_type: flow_tracing
      modification_case: false
    - id: qwenpaw-case-v-backup-restore-flow
      file: cases/qwenpaw-case-v-backup-restore-flow.yaml
      golden: ground-truth/qwenpaw-case-v-backup-restore-flow-ground-truth.yaml
      task_type: flow_tracing
      modification_case: false
    - id: qwenpaw-case-w-token-usage-data-flow
      file: cases/qwenpaw-case-w-token-usage-data-flow.yaml
      golden: ground-truth/qwenpaw-case-w-token-usage-data-flow-ground-truth.yaml
      task_type: data_flow
      modification_case: false
    - id: qwenpaw-case-x-weixin-wechat-migration-data-flow
      file: cases/qwenpaw-case-x-weixin-wechat-migration-data-flow.yaml
      golden: ground-truth/qwenpaw-case-x-weixin-wechat-migration-data-flow-ground-truth.yaml
      task_type: data_flow
      modification_case: false
    - id: qwenpaw-case-y-token-usage-flush-retry-bug
      file: cases/qwenpaw-case-y-token-usage-flush-retry-bug.yaml
      golden: ground-truth/qwenpaw-case-y-token-usage-flush-retry-bug-ground-truth.yaml
      task_type: bug_localization
      modification_case: false
    - id: qwenpaw-case-z-corrupt-inbox-recovery-bug
      file: cases/qwenpaw-case-z-corrupt-inbox-recovery-bug.yaml
      golden: ground-truth/qwenpaw-case-z-corrupt-inbox-recovery-bug-ground-truth.yaml
      task_type: bug_localization
      modification_case: false

run_matrix:
  agents:
    - claude-code
  tool_policies:
    - grep
    - graph
  repeats_per_cell: 3
  total_required_runs: 54  # 9 cases × 1 agent × 2 policies × 3 repeats

isolation:
  analysis_cases:
    fresh_agent_context: true
    clean_worktree_required: false
    allow_no_edit: true
  modification_cases:
    fresh_agent_context: true
    clean_worktree_required: true
    isolated_worktree_per_run: true
    reset_or_discard_after_run: true
  forbidden_context:
    - golden answers
    - previous run outputs
    - scoring notes
    - benchmark design discussion documents

expected_report_sections:
  - per_case_agent_policy_scores
  - claude_code_graph_vs_grep
  - opencode_graph_vs_grep
  - graph_uplift_across_agents
  - claude_code_vs_opencode_under_grep
  - claude_code_vs_opencode_under_graph
  - invalid_or_policy_violating_runs
  - qualitative_failure_patterns
  - python_backend_vs_typescript_frontend_sensitivity

success_criteria:
  - All required run cells produce a valid run-result JSON or an explicit invalid-run record.
  - Case D reports all 26 direct reload callers separately from wrapper-driven indirect entrypoints.
  - Case E distinguishes direct Provider overrides, transitive OpenAIProvider inheritance, and model-factory callers.
  - Case F includes the bundled CloudPaw command handler and excludes unrelated handle methods.
  - Cases U-V trace complete production execution paths and distinguish synchronous, asynchronous, and reconnect branches.
  - Cases W-X trace field-level propagation, transformations, persistence, and intentional omissions.
  - Cases Y-Z localize the root cause and distinguish the observed bug from nearby but non-causal code.
  - Final report distinguishes GitNexus graph uplift from agent-specific behavior.
