must_mention:
  - create_model_and_formatter prefers an agent-specific active_model and otherwise uses ProviderManager.get_active_chat_model.
  - Runtime options must be applied consistently on both model-selection paths.
  - OllamaProvider is a transitive override through OpenAIProvider, while LMStudioProvider inherits the OpenAI implementation.
  - Formatter selection and TokenRecordingModelWrapper/RetryChatModel wrapping occur after model construction and should not be mistaken for provider implementations.

must_exclude_from_impact:
  - symbol: TokenRecordingModelWrapper
    reason: Post-construction wrapper, not a provider implementation. Signature change does not affect it.
  - symbol: RetryChatModel
    reason: Post-construction wrapper, not a provider implementation.
  - symbol: get_active_model_supports_multimodal
    reason: Independent model capability query, unaffected by get_chat_model_instance signature change.

recommended_validation:
