  - symbol: _post_load_setup
    chain: "install_plugin/upload_plugin -> _post_load_setup -> _schedule_all_agents_reload -> schedule_agent_reload"
    file: src/qwenpaw/app/routers/plugins.py
  - symbol: uninstall_plugin
    chain: "uninstall_plugin -> _schedule_all_agents_reload -> schedule_agent_reload"
    file: src/qwenpaw/app/routers/plugins.py

must_mention:
  - The function extracts request.app.state.multi_agent_manager before creating the task.
  - Missing MultiAgentManager logs a warning and returns without scheduling.
  - asyncio.create_task makes API responses non-blocking.
  - Background exceptions are logged and not propagated to the original HTTP request.
  - A required reload_reason must be supplied by all 26 direct callers, including wrapper functions.
  - Plugin-wide reload iterates agent IDs, so the reason must remain stable across fan-out.

must_exclude_from_impact:
  - symbol: MCPClient.reload
    reason: MCP server reconnection, unrelated to agent reload scheduling.
  - symbol: BaseChannel.send
    reason: Channel message sending, a different operation entirely.
  - symbol: crons.manager.reschedule_heartbeat
    reason: Cron job rescheduling, unrelated to agent configuration reload.
  - symbol: MultiAgentManager.preload_agent
    reason: Pre-loading is a different lifecycle operation from reload.

recommended_validation:
  - python -m pytest tests/unit/app
  - targeted tests for missing manager, background failure, OAuth token persistence, plugin fan-out, and one route from each caller group
