- description: deviceFamily, risk, and status use @Enumerated(EnumType.STRING)
  id: fact.enumerated-string
- description: steps field has @OneToMany(mappedBy=change cascade=ALL orphanRemoval=true)
  id: fact.one-to-many-steps
- description: approval field has @ManyToOne(fetch=LAZY) @JoinColumn(name=approval_id)
  id: fact.many-to-one-approval
- description: maintenanceWindow uses @Embedded referencing ChangeWindowEmbeddable @Embeddable
  id: fact.embedded-window
- description: version field has @Version for optimistic locking
  id: fact.version-optimistic
- description: findByRegionCodeAndStatus is a Spring Data derived query from method name
  id: fact.derived-query
- description: findRiskQueue uses @Query with JPQL select c from NetworkChangeEntity c where c.risk = :risk and c.status in :statuses
  id: fact.jpql-query
- description: findByRegionNative uses @Query with nativeQuery=true and raw SQL
  id: fact.native-query
- description: ChangeRecordDto has tableName field but is NOT a JPA entity — no @Entity annotation
  id: fact.change-record-dto-not-entity
