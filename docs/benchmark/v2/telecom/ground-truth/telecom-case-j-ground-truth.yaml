all_change_executor_beans:
- annotations:
  - '@Component'
  - '@ChangeExecutorCandidate'
  bean_name: routerExecutor
  class: RouterChangeExecutor
  supports: ROUTER
- annotations:
  - '@Component'
  - '@ChangeExecutorCandidate'
  bean_name: transmissionExecutor
  class: TransmissionChangeExecutor
  supports: TRANSMISSION
- annotations:
  - '@Primary'
  - '@Component'
  - '@ChangeExecutorCandidate'
  bean_name: radioExecutor
  class: RadioChangeExecutor
  supports: RADIO
- annotations:
  - '@Component'
  bean_name: safeExecutor
  class: SafeChangeExecutor
  note: No @ChangeExecutorCandidate
  supports: ALL
- annotations:
  - '@Profile("dry-run")'
  - '@Component'
  - '@ChangeExecutorCandidate'
  bean_name: (generated)
  class: DryRunChangeExecutor
  condition: Only active under dry-run profile
  supports: ALL
- annotations:
  - '@Bean in @Profile("benchmark") config'
  bean_name: benchmarkExecutor
  class: (anonymous in ChangeExecutorConfiguration)
  condition: Only active under benchmark profile
  supports: ALL
