  - bean_name: transmissionExecutor
    class: TransmissionChangeExecutor
    file: network-change-service/src/main/java/com/example/telecom/change/executor/TransmissionChangeExecutor.java
  - bean_name: radioExecutor
    class: RadioChangeExecutor
    file: network-change-service/src/main/java/com/example/telecom/change/executor/RadioChangeExecutor.java
  type: List<ChangeExecutor>
- description: Map injection collects ALL ChangeExecutor beans regardless of @ChangeExecutorCandidate
