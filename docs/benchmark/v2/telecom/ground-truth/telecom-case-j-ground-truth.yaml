injection_parameters:
- description: Standard @Qualifier selects SafeChangeExecutor by bean name
  id: j.injection_parameters.safeexecutor
  parameter: safeExecutor
  qualifier: '@Qualifier("safeExecutor")'
  runtime_target: SafeChangeExecutor
  runtime_target_bean_name: safeExecutor
  static_target: ChangeExecutor
  type: ChangeExecutor
- custom_qualifier: true
  excluded:
  - bean_name: safeExecutor
    class: SafeChangeExecutor
    reason: Not annotated with @ChangeExecutorCandidate — excluded from custom qualifier collection
  - class: DryRunChangeExecutor
    reason: '@Profile("dry-run") — not active under benchmark profile'
  - bean_name: benchmarkExecutor
    class: (anonymous in ChangeExecutorConfiguration)
    reason: Not annotated with @ChangeExecutorCandidate
  id: j.injection_parameters.executors
  parameter: executors
  qualifier: '@ChangeExecutorCandidate'
  runtime_members:
