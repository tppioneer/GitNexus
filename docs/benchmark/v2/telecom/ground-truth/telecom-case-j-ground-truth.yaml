expected_facts:
- description: RadioChangeExecutor is @Primary so bare ChangeExecutor injection resolves to RadioChangeExecutor
  id: fact.primary-radio
- description: '@Qualifier(safeExecutor) selects SafeChangeExecutor for the safeExecutor parameter'
  id: fact.qualifier-safe
- description: '@ChangeExecutorCandidate List excludes SafeChangeExecutor because it lacks the annotation'
  id: fact.candidate-excludes-safe
- description: Under benchmark profile DryRunChangeExecutor is excluded because @Profile(dry-run) is not active
  id: fact.candidate-excludes-dryrun-benchmark
- description: Map<String,ChangeExecutor> injection collects ALL ChangeExecutor beans including safeExecutor and benchmarkExecutor
  id: fact.map-includes-all
- description: ObjectProvider<RollbackHandler> only provides StandardRollbackHandler because RemoteRollbackHandler requires telecom.change.remote.enabled=true
  id: fact.rollback-standard-only
- description: LegacyChangeFacade uses @Autowired @Qualifier(routerExecutor) field injection resolving to RouterChangeExecutor
  id: fact.legacy-field-router
