expected_facts:
- id: fact.route-count
  description: network-change-service exposes 19 routes total across 4 controllers
- id: fact.four-controllers
  description: 'Four controllers: NetworkChangeController, LegacyNetworkChangeController, ComposedEndpointController, MvcConditionsController'
- id: fact.class-prefix-composition
  description: NetworkChangeController, ComposedEndpointController, and MvcConditionsController have class-level @RequestMapping prefix /api/network-changes
- id: fact.legacy-no-prefix
  description: LegacyNetworkChangeController has no class-level @RequestMapping prefix
- id: fact.r08-array-expansion
  description: R08 @GetMapping({/active, /open}) expands to two separate routes with the same handler listActive
- id: fact.r09-composed-only
  description: R09 uses only @OpsReadEndpoint which carries @RequestMapping(method=GET) as meta-annotation — no backup @GetMapping needed
- id: fact.r10-fully-qualified
  description: R10 uses fully-qualified @org.springframework.web.bind.annotation.GetMapping resolving to the same mapping as short-name
- id: fact.r11-constant-path
  description: R11 path comes from ChangeRoutes.PENDING constant value /pending
- id: fact.r12-no-method-path
  description: R12 @GetMapping with no path resolves to class prefix /api/network-changes only
- id: fact.r13-produces
  description: R13 uses produces=application/json condition
- id: fact.r14-consumes
  description: R14 uses consumes=application/xml condition
- id: fact.r15-params
  description: R15 uses params=region condition — requires query parameter
- id: fact.r16-headers
  description: R16 uses headers=X-Admin=true condition
- id: fact.r17-multi-method
  description: 'R17 expands to two routes: GET and POST via method={GET,POST}'
