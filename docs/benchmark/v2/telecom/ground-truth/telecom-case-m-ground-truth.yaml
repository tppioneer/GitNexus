- id: ep.change-execution-service
  symbol: ChangeExecutionService
  file: network-change-service/src/main/java/com/example/telecom/change/service/ChangeExecutionService.java
expected_symbols:
- id: sym.change-executor
  symbol: ChangeExecutor
  file: network-change-service/src/main/java/com/example/telecom/change/executor/ChangeExecutor.java
- id: sym.abstract-change-executor
  symbol: AbstractChangeExecutor
  file: network-change-service/src/main/java/com/example/telecom/change/executor/AbstractChangeExecutor.java
- id: sym.router-executor
