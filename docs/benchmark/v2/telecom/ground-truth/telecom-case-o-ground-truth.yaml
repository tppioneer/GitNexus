expected_facts:
- id: fact.event-approved-dispatch
  description: publishEvent(ChangeApprovedEvent) dispatches to ChangeApprovedListener.onApproved via @EventListener — FRAMEWORK_EVENT_DISPATCH not CALLS
- id: fact.event-completed-after-commit
  description: ChangeCompletedListener.afterCommit uses @TransactionalEventListener(AFTER_COMMIT) — only fires after transaction commits
- id: fact.event-async-notification
  description: ChangeNotificationListener.notifyAsync uses @Async @EventListener — dispatched on separate thread
- id: fact.aop-around-advice
  description: AuditOperationAspect uses @Around(@annotation(auditOperation)) to intercept methods with @AuditOperation
- id: fact.proceed-not-direct-call
  description: ProceedingJoinPoint.proceed() is NOT a static call to business method — it is AOP framework invocation chain
- id: fact.class-for-name-reflection
  description: Class.forName(pluginClassName) is runtime string-to-class resolution — NOT a static call edge
- id: fact.method-invoke-reflection
  description: Method.invoke(plugin, context) is reflective invocation — target determined at runtime not compile time
- id: fact.service-loader-spi
  description: ServiceLoader.load(ChangeValidationPlugin.class) discovers BenchmarkChangeValidationPlugin via META-INF/services — SERVICE_LOADER edge
- id: fact.descriptor-string-config
  description: PluginDescriptor.className and executeMethodName are configuration strings not code references — cannot be resolved statically
