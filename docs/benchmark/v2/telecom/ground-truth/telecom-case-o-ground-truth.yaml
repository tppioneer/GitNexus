- id: event-approved
  publisher_method: ChangePlanService.approve
  publisher_file: network-change-service/src/main/java/com/example/telecom/change/service/ChangePlanService.java
  call_expression: eventPublisher.publishEvent(new ChangeApprovedEvent(planId, approverId, true))
  event_type: ChangeApprovedEvent
  edge_kind: FRAMEWORK_EVENT_DISPATCH
  listeners:
  - class: ChangeApprovedListener
    method: onApproved(ChangeApprovedEvent)
    file: network-change-service/src/main/java/com/example/telecom/change/event/ChangeApprovedListener.java
    annotation: '@EventListener'
    binding: Spring framework resolves ChangeApprovedEvent → ChangeApprovedListener.onApproved at runtime
- id: event-completed-sync
  publisher_method: ChangeExecutionService.execute
  publisher_file: network-change-service/src/main/java/com/example/telecom/change/service/ChangeExecutionService.java
  call_expression: eventPublisher.publishEvent(new ChangeCompletedEvent(...))
  event_type: ChangeCompletedEvent
  edge_kind: FRAMEWORK_EVENT_DISPATCH
