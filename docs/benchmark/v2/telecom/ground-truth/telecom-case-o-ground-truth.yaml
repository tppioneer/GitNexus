    method: afterCommit(ChangeCompletedEvent)
    file: network-change-service/src/main/java/com/example/telecom/change/event/ChangeCompletedListener.java
    annotation: '@TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)'
    binding: Event delivered ONLY after the enclosing transaction commits
- id: event-completed-async
