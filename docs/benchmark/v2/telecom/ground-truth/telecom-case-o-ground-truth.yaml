    annotation: '@Async @EventListener'
    binding: Async dispatch — executed on a separate thread
spring_event_note: 'publishEvent() to listener is NOT a Java direct call. Static analysis tools must classify these as FRAMEWORK_EVENT_DISPATCH, not CALLS. The connection between publisher and listener
  is resolved by Spring''s event mechanism at runtime, not by compile-time type analysis.

  '
aop_dispatch:
- id: aop-audit-operation
  aspect: AuditOperationAspect
  file: network-change-service/src/main/java/com/example/telecom/change/aop/AuditOperationAspect.java
  annotation: '@Aspect @Component'
  advice:
    type: '@Around'
    pointcut: '@annotation(auditOperation)'
    parameter_binding: AuditOperation auditOperation
  edge_kind: FRAMEWORK_AOP
  intercepted_methods:
  - target: ChangePlanService.createPlan
    annotation: '@AuditOperation(action="create-plan", category=CHANGE)'
  - target: ChangePlanService.updateRisk
    annotation: '@AuditOperation(action="update-risk", category=CHANGE, sensitive=true)'
  - target: ChangeAuditService.record
    annotation: '@AuditOperation(action="record-audit", category=CHANGE)'
  - target: Any method with @CriticalChange (meta-annotated with @AuditOperation)
    indirect: true
    meta_chain: '@CriticalChange → @AuditOperation'
  proceeds_through: ProceedingJoinPoint.proceed()
  note: 'ProceedingJoinPoint.proceed() is NOT a static call to the business method. It is the AOP framework''s mechanism to continue the invocation chain. The edge from aspect to target method is FRAMEWORK_AOP,
    not CALLS.

    '
reflection_boundary:
- id: reflection-classForName
  caller: ChangePluginLoader.loadAndExecuteReflective
  file: network-change-service/src/main/java/com/example/telecom/change/plugin/ChangePluginLoader.java
  expressions:
  - expression: Class.forName(pluginClassName)
    edge_kind: REFLECTION_BOUNDARY
    note: String-to-class resolution at runtime — NOT a static call edge
  - expression: type.getDeclaredConstructor().newInstance()
    edge_kind: REFLECTION_BOUNDARY
    note: Reflective instantiation — target class determined by string parameter
  - expression: type.getMethod("execute", ChangeContext.class)
    edge_kind: REFLECTION_BOUNDARY
    note: Method lookup by name string — NOT a compile-time method reference
  - expression: method.invoke(plugin, context)
    edge_kind: REFLECTION_BOUNDARY
    note: Reflective invocation — target determined at runtime
  runtime_target:
    class: BenchmarkChangeValidationPlugin
    configuration_source: 'application.properties: telecom.change.plugin-class-name'
    fqn: com.example.telecom.change.plugin.BenchmarkChangeValidationPlugin
- id: service-loader
  caller: ChangePluginLoader.loadViaServiceLoader
  file: network-change-service/src/main/java/com/example/telecom/change/plugin/ChangePluginLoader.java
  expression: ServiceLoader.load(ChangeValidationPlugin.class)
  edge_kind: SERVICE_LOADER
  service_interface: ChangeValidationPlugin
  meta_inf_services_file: network-change-service/src/main/resources/META-INF/services/com.example.telecom.change.plugin.ChangeValidationPlugin
  registered_implementations:
  - com.example.telecom.change.plugin.BenchmarkChangeValidationPlugin
- id: descriptor-based
  caller: ChangePluginLoader.executeFromDescriptor
  file: network-change-service/src/main/java/com/example/telecom/change/plugin/ChangePluginLoader.java
  expression: loadAndExecuteReflective(descriptor.getClassName(), context)
  edge_kind: REFLECTION_BOUNDARY
  configuration_source: PluginDescriptor.className — string configuration, not code reference
reflection_boundary_note: 'Reflection and ServiceLoader targets cannot be determined by pure static call-graph analysis. Tools should report these as REFLECTION_BOUNDARY or SERVICE_LOADER edges, not as
  regular CALLS. Finding the class name string in source code does NOT mean the tool has resolved a Java call edge.

  '
boundary_classification:
- edge_kind: JAVA_DIRECT_CALL
  examples:
  - ChangePlanService.approve → snapshotStore.save
  - ChangeExecutionService.execute → registry.resolve
- edge_kind: JAVA_INTERFACE_DISPATCH
  examples:
  - executor.execute(context) → ChangeExecutor implementations
- edge_kind: FRAMEWORK_EVENT_DISPATCH
  examples:
  - publishEvent(ChangeApprovedEvent) → ChangeApprovedListener.onApproved
  - publishEvent(ChangeCompletedEvent) → ChangeCompletedListener.afterCommit
  - publishEvent(ChangeCompletedEvent) → ChangeNotificationListener.notifyAsync
- edge_kind: FRAMEWORK_AOP
  examples:
  - AuditOperationAspect.around → @AuditOperation methods via ProceedingJoinPoint
- edge_kind: REFLECTION_BOUNDARY
  examples:
  - Class.forName → newInstance → getMethod → invoke
  - PluginDescriptor.getClassName() → reflective load
- edge_kind: SERVICE_LOADER
  examples:
  - ServiceLoader.load(ChangeValidationPlugin.class) → BenchmarkChangeValidationPlugin
