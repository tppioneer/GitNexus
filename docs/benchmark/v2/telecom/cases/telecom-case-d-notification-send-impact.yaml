id: telecom-case-d-notification-send-impact
name: Telecom NotificationChannel.send 接口签名变更影响分析
level: L2
task_type: impact_analysis
repo: telecom-ops-platform
status: draft-ground-truth

prompt: |
  为了在通知发送链路上做路由审计和灰度控制，需要给 NotificationChannel.send
  增加一个 DeliveryContext 参数，让所有发送入口都携带可追溯的路由上下文。

  请分析这个签名变更会影响哪些实现类、直接调用方和通过事件或调度间接触发的入口，
  以及哪些测试需要同步更新。不要修改代码，只输出影响分析。

graph_queries:
  - 'context({name: "NotificationChannel"})'
  - 'impact({target: "send", direction: "upstream"})'

grep_searches:
  - rg "interface NotificationChannel|implements NotificationChannel|send\("
  - rg "NotificationService|NotificationRetryService|WorkOrderEventConsumer"


ground_truth: docs/benchmark/v2/telecom/ground-truth/telecom-case-d-ground-truth.yaml

risk_level: MEDIUM

scoring:
  must_identify:
    - 3 个 NotificationChannel 实现类
    - NotificationService.process 与 NotificationRetryService.retry 两个接口型调用点
    - WorkOrderEventConsumer.onWorkOrderChanged 间接入口
    - NotificationChannelSendTest、NotificationServiceTest、WorkOrderEventConsumerTest
