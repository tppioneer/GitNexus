id: telecom-large-case-d-dispatch-rule-impact
name: Telecom Large DispatchRule.evaluate 签名变更影响分析
level: L2
task_type: impact_analysis
repo: telecom-ops-platform-large
status: draft-ground-truth

prompt: |
  dispatch-service 中 DispatchRule.evaluate 通过 Registry 多态分发。
  我们需要增加一个 DispatchRuleOptions 参数来支持灰度路由和优先级覆盖。

  请分析这个签名变更会影响哪些 DispatchRule 实现、Registry 调度层、直接和间接调用方，
  以及受影响的测试与配置。仓库中存在多个其他 evaluate 方法，请明确哪些不属于 DispatchRule 影响面。
  不要修改代码，只输出影响分析。

graph_queries:
  - 'context({name: "DispatchRule"})'
  - 'impact({target: "evaluate", direction: "upstream"})'

grep_searches:
  - rg "interface DispatchRule|implements DispatchRule|evaluate\("
  - rg "DispatchRuleRegistry|evaluateAll|evaluateRules"


ground_truth: docs/benchmark/v2/telecom/large/ground-truth/telecom-large-case-d-ground-truth.yaml

risk_level: MEDIUM

scoring:
  must_identify:
    - 4 个 DispatchRule 实现类
    - DispatchRuleRegistry.evaluateAll 直接接口调用
    - DispatchEngine、DispatchRuleService、DispatchOptimizer、DispatchOrchestrationService 间接影响
    - DispatchRuleServiceTest
