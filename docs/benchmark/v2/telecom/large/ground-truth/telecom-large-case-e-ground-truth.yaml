  - SlaCalculatorRegistry.calculateAll is the direct interface-typed caller.
  - SlaMonitor and SlaMonitoringService are the monitoring layer; two Controller endpoints are the HTTP entry.
  - Context propagation must cover both single-contract checkContract and all-contract manualCheck paths.
  - The registry is mutable through register/unregister/resolve; custom calculators must follow the new contract.

