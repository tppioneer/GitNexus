version: 1
name: telecom-ops-platform-large-agent-benchmark


target_project:
  name: telecom-ops-platform-large
  gitnexus_repo: telecom-large
  path: F:/develop/codes/Gitnexus-case-project/telecom-ops-platform-large
  language: java
  build_tool: maven
  prerequisites:
    java_home: C:/Program Files/Eclipse Adoptium/jdk-17.0.19.10-hotspot
    maven_home: C:/tools/apache-maven-3.9.16
  validation_commands:
    - mvn test

project_overview:
  name: telecom-ops-platform
  language: Java
  framework: Spring Boot 3.x, Maven, H2
  lines_of_code: 49503
  modules: 12
  description: 电信运维平台（50K 规模版），涵盖设备采集、告警引擎、工单流转、通知、看板、联邦告警、厂商协同等模块

case_source:
  directory: docs/benchmark/v2/telecom/large/cases
  golden_directory: docs/benchmark/v2/telecom/large/ground-truth
  hide_expected_fields_from_agent: true
  cases:
    - id: telecom-large-case-d-dispatch-rule-impact
      file: cases/telecom-large-case-d-dispatch-rule-impact.yaml
      golden: ground-truth/telecom-large-case-d-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: telecom-large-case-e-sla-calculator-impact
      file: cases/telecom-large-case-e-sla-calculator-impact.yaml
      golden: ground-truth/telecom-large-case-e-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: telecom-large-case-f-alarm-lifecycle-hook-impact
      file: cases/telecom-large-case-f-alarm-lifecycle-hook-impact.yaml
      golden: ground-truth/telecom-large-case-f-ground-truth.yaml
      task_type: impact_analysis
      modification_case: false
    - id: telecom-large-case-u-dispatch-assignment-flow
      file: cases/telecom-large-case-u-dispatch-assignment-flow.yaml
      golden: ground-truth/telecom-large-case-u-ground-truth.yaml
      task_type: flow_tracing
      modification_case: false
    - id: telecom-large-case-v-federated-alarm-ingest-flow
      file: cases/telecom-large-case-v-federated-alarm-ingest-flow.yaml
      golden: ground-truth/telecom-large-case-v-ground-truth.yaml
      task_type: flow_tracing
      modification_case: false
    - id: telecom-large-case-w-device-lifecycle-data-flow
      file: cases/telecom-large-case-w-device-lifecycle-data-flow.yaml
      golden: ground-truth/telecom-large-case-w-ground-truth.yaml
      task_type: data_flow
      modification_case: false
    - id: telecom-large-case-x-sla-breach-data-flow
      file: cases/telecom-large-case-x-sla-breach-data-flow.yaml
      golden: ground-truth/telecom-large-case-x-ground-truth.yaml
      task_type: data_flow
      modification_case: false
    - id: telecom-large-case-y-dispatch-priority-filter-bug
      file: cases/telecom-large-case-y-dispatch-priority-filter-bug.yaml
      golden: ground-truth/telecom-large-case-y-ground-truth.yaml
      task_type: bug_localization
      modification_case: false
    - id: telecom-large-case-z-batch-dispatch-failure-bug
      file: cases/telecom-large-case-z-batch-dispatch-failure-bug.yaml
      golden: ground-truth/telecom-large-case-z-ground-truth.yaml
      task_type: bug_localization
      modification_case: false

run_matrix:
  agents:
    - claude-code
  tool_policies:
    - grep
    - graph
  repeats_per_cell: 3
  total_required_runs: 54  # 9 cases × 1 agent × 2 policies × 3 repeats

isolation:
  analysis_cases:
    fresh_agent_context: true
    clean_worktree_required: false
    allow_no_edit: true
  modification_cases:
    fresh_agent_context: true
    clean_worktree_required: true
    isolated_worktree_per_run: true
    reset_or_discard_after_run: true
  forbidden_context:
    - golden answers
    - previous run outputs
    - scoring notes
    - benchmark design discussion documents

expected_report_sections:
  - per_case_agent_policy_scores
  - claude_code_graph_vs_grep
  - graph_uplift_across_agents
  - invalid_or_policy_violating_runs
  - qualitative_failure_patterns

success_criteria:
  - All required run cells produce a valid run-result JSON or an explicit invalid-run record.
  - Case D distinguishes true DispatchRule implementations from same-name noise and includes multi-hop callers.
  - Case E distinguishes true SlaCalculator implementations from SLA policy noise and includes multi-hop callers.
  - Case F reports that AlarmHookRegistry currently has test callers but no production caller.
  - Cases U-V trace complete production execution paths and separate real integrations from in-memory or disconnected stubs.
  - Cases W-X trace state and metric fields through validation, persistence, events, and response mapping.
  - Cases Y-Z localize observable API defects at the layer where input or per-item results are discarded.
  - Final report does not attribute agent differences to GitNexus without the within-agent graph-vs-grep comparison.
