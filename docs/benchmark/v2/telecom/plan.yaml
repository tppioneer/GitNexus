run_matrix:
  agents:
    - claude-code
    - opencode
  tool_policies:
    - grep
    - graph
  repeats_per_cell: 3
  total_required_runs: 204  # 17 cases × 2 agents × 2 policies × 3 repeats

isolation:
  analysis_cases:
    fresh_agent_context: true
    clean_worktree_required: false
    allow_no_edit: true
  modification_cases:
    fresh_agent_context: true
    clean_worktree_required: true
    isolated_worktree_per_run: true
    reset_or_discard_after_run: true
  forbidden_context:
    - golden answers
    - previous run outputs
    - scoring notes
    - benchmark design discussion documents

expected_report_sections:
  - per_case_agent_policy_scores
  - claude_code_graph_vs_grep
  - opencode_graph_vs_grep
  - graph_uplift_across_agents
  - claude_code_vs_opencode_under_grep
  - claude_code_vs_opencode_under_graph
  - invalid_or_policy_violating_runs
  - qualitative_failure_patterns

success_criteria:
  - All required run cells produce a valid run-result JSON or an explicit invalid-run record.
  - Case D distinguishes NotificationChannel implementations and retry callers from unrelated send methods.
  - Case E traces AssigneeSelector implementations through Registry to automatic, bulk, and event-driven assignment paths.
  - Case F reports all six WorkOrderFlowService transition callers and their upstream entrypoints.
  - Case H lists all R01-R12 routes with correct HTTP method, path, handler linkage, and class-prefix composition.
  - Case I identifies all 8 custom annotation types, their elements, applications, repeatable containers, and meta-annotation chains.
  - Case J correctly resolves @Qualifier, @Primary, @Profile, custom qualifier, and collection injection under each profile.
  - Case K identifies all @Transactional boundaries, propagation, readOnly, and explains the self-invocation trap.
  - Case L maps all JPA entities, relationships, embedded objects, and repository queries (derived, JPQL, native).
  - Case M provides three-layer dispatch truth (static/possible/runtime) for interface, template method, and default method calls.
  - Case N resolves all three ChangeCommandBus.dispatch overloads by exact signature, plus lambda/method reference/callback targets.
  - Case O correctly classifies Spring event dispatch, AOP advice, reflection, and ServiceLoader edges without confusing them with direct calls.
  - Cases U-V trace complete production execution paths and identify branch boundaries and side effects.
  - Cases W-X trace field-level transformations and explicitly account for dropped or derived values.
  - Cases Y-Z identify the executable root cause and propose regression checks tied to the failure mechanism.
  - Final report does not attribute agent differences to GitNexus without the within-agent graph-vs-grep comparison.
