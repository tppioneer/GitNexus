# GitNexus — Milvus Standalone (dev / single-machine)
#
# Usage:
#   docker compose -f scripts/milvus-standalone.yaml up -d
#   docker compose -f scripts/milvus-standalone.yaml stop
#   docker compose -f scripts/milvus-standalone.yaml down -v   # wipe all data
#
# After startup, configure GitNexus:
#   $env:GITNEXUS_VECTOR_STORE="milvus"
#   $env:GITNEXUS_MILVUS_ADDRESS="localhost:19530"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"    # MinIO Web Console
    volumes:
      - milvus-minio:/minio_data

  standalone:
    image: milvusdb/milvus:v2.6.18
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  milvus-etcd:
  milvus-minio:
